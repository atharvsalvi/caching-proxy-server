[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caching-proxy"
version = "0.1.0"
description = "A threaded HTTP caching proxy with Redis-backed shared cache entries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["redis"]

[tool.setuptools]
packages = ["proxy_server"]

[project.scripts]
caching-proxy = "proxy_server.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["redis: requires a live Redis server on loopback"]
